# GitHub Actions deployment workflow
# This workflow deploys the WebRTC app to a Node.js server on every push to main

name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: cd server && npm ci
      
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            cd /home/deploy/webrtc-chat-app
            git pull origin main
            cd server
            npm install --production
            pm2 restart webrtc-chat || pm2 start server.js --name webrtc-chat
            pm2 save

# --- Alternative: Railway/Railfox deployment (no secrets needed) ---
# Just push to GitHub and link the repo to Railway.app or Render.com
# They auto-deploy on every push to main

# --- Alternative: Vercel (serverless adapter) ---
# Use vercel.json instead of this workflow for Vercel deployment